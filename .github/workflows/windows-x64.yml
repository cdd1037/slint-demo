name: Windows x64 Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build x86_64-pc-windows-msvc
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact and report size
        shell: pwsh
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\slint-demo.exe"
          if (!(Test-Path $exe)) {
            throw "Expected executable not found: $exe"
          }

          $bytes = (Get-Item $exe).Length
          $mib = [math]::Round($bytes / 1MB, 2)
          Write-Host "slint-demo.exe: $bytes bytes ($mib MiB)"

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe "dist\slint-demo.exe"
          Compress-Archive -Path "dist\slint-demo.exe" -DestinationPath "dist\slint-demo-windows-x64.zip" -Force

          "### Windows x64 Release" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Target: ``x86_64-pc-windows-msvc``" >> $env:GITHUB_STEP_SUMMARY
          "- EXE size: **$bytes bytes ($mib MiB)**" >> $env:GITHUB_STEP_SUMMARY
          "- Renderer: **FemtoVG**" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: slint-demo-windows-x64
          path: |
            dist/slint-demo.exe
            dist/slint-demo-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
